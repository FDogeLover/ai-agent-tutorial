<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Harness 六层架构堆叠图：入口层、上下文层、执行层、安全层、验证层、反馈层，每层标注最小组件">
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
    .t{fill:#1e293b}.s{fill:#64748b}
    .name{fill:#f5f8ff;stroke:#bfdbfe;stroke-width:1.5}
    .body{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
    .brandtext{fill:#2563eb}
    .brandline{stroke:#94a3b8;stroke-width:1.4;fill:none}
    @media (prefers-color-scheme: dark){
      .t{fill:#e2e8f0}.s{fill:#94a3b8}
      .name{fill:#17233b;stroke:#1e3a5f}
      .body{fill:#151d2b;stroke:#334155}
      .brandtext{fill:#60a5fa}
      .brandline{stroke:#64748b}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 入口层 -->
  <rect x="40" y="20" width="150" height="54" rx="8" class="name"/>
  <text x="115" y="43" text-anchor="middle" font-size="14" font-weight="bold" class="brandtext">入口层</text>
  <text x="115" y="61" text-anchor="middle" font-size="10" class="s">收任务、定意图</text>
  <rect x="196" y="20" width="484" height="54" rx="8" class="body"/>
  <text x="216" y="52" font-size="12" class="s">任务卡模板 · 任务队列</text>
  <line x1="115" y1="74" x2="115" y2="78" class="brandline" marker-end="url(#ah)"/>

  <!-- 上下文层 -->
  <rect x="40" y="82" width="150" height="54" rx="8" class="name"/>
  <text x="115" y="105" text-anchor="middle" font-size="14" font-weight="bold" class="brandtext">上下文层</text>
  <text x="115" y="123" text-anchor="middle" font-size="10" class="s">提供视野</text>
  <rect x="196" y="82" width="484" height="54" rx="8" class="body"/>
  <text x="216" y="114" font-size="12" class="s">CONTEXT.md · 材料清单 · 规则文件</text>
  <line x1="115" y1="136" x2="115" y2="140" class="brandline" marker-end="url(#ah)"/>

  <!-- 执行层 -->
  <rect x="40" y="144" width="150" height="54" rx="8" class="name"/>
  <text x="115" y="167" text-anchor="middle" font-size="14" font-weight="bold" class="brandtext">执行层</text>
  <text x="115" y="185" text-anchor="middle" font-size="10" class="s">干活</text>
  <rect x="196" y="144" width="484" height="54" rx="8" class="body"/>
  <text x="216" y="176" font-size="12" class="s">Agent 产品 · Skill · 脚本</text>
  <line x1="115" y1="198" x2="115" y2="202" class="brandline" marker-end="url(#ah)"/>

  <!-- 安全层 -->
  <rect x="40" y="206" width="150" height="54" rx="8" class="name"/>
  <text x="115" y="229" text-anchor="middle" font-size="14" font-weight="bold" class="brandtext">安全层</text>
  <text x="115" y="247" text-anchor="middle" font-size="10" class="s">控边界</text>
  <rect x="196" y="206" width="484" height="54" rx="8" class="body"/>
  <text x="216" y="238" font-size="12" class="s">权限卡 · 审批规则 · 备份</text>
  <line x1="115" y1="260" x2="115" y2="264" class="brandline" marker-end="url(#ah)"/>

  <!-- 验证层 -->
  <rect x="40" y="268" width="150" height="54" rx="8" class="name"/>
  <text x="115" y="291" text-anchor="middle" font-size="14" font-weight="bold" class="brandtext">验证层</text>
  <text x="115" y="309" text-anchor="middle" font-size="10" class="s">保证质量</text>
  <rect x="196" y="268" width="484" height="54" rx="8" class="body"/>
  <text x="216" y="300" font-size="12" class="s">验收清单 · 自检要求 · 哈希校验</text>
  <line x1="115" y1="322" x2="115" y2="326" class="brandline" marker-end="url(#ah)"/>

  <!-- 反馈层 -->
  <rect x="40" y="330" width="150" height="54" rx="8" class="name"/>
  <text x="115" y="353" text-anchor="middle" font-size="14" font-weight="bold" class="brandtext">反馈层</text>
  <text x="115" y="371" text-anchor="middle" font-size="10" class="s">沉淀改进</text>
  <rect x="196" y="330" width="484" height="54" rx="8" class="body"/>
  <text x="216" y="362" font-size="12" class="s">复盘记录 · 易变信息表 · 模板迭代</text>

  <text x="360" y="402" text-anchor="middle" font-size="12" class="s">每层只做一件事，层间靠文件传递信息——改一层，不动其他层</text>
</svg>
