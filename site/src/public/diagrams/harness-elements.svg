<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" role="img" aria-label="Harness 七要素示意图：上下文、Agent、工具、验证、交付为主线，权限在 Agent 与工具之间设门禁，状态记录进度，反馈回到上下文">
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
    .t{fill:#1e293b}.s{fill:#64748b}
    .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
    .node{fill:#f5f8ff;stroke:#2563eb;stroke-width:1.5}
    .gate{fill:#fffbeb;stroke:#d97706;stroke-width:1.5}
    .brandline{stroke:#2563eb;stroke-width:1.6;fill:none}
    .gateline{stroke:#d97706;stroke-width:1.6;fill:none}
    .brandfill{fill:#2563eb}.gatefill{fill:#d97706}
    @media (prefers-color-scheme: dark){
      .t{fill:#e2e8f0}.s{fill:#94a3b8}
      .card{fill:#151d2b;stroke:#334155}
      .node{fill:#17233b;stroke:#3b82f6}
      .gate{fill:#2a2113;stroke:#f59e0b}
      .brandline{stroke:#3b82f6}
      .gateline{stroke:#f59e0b}
      .brandfill{fill:#3b82f6}.gatefill{fill:#f59e0b}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" class="brandfill"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" class="brandfill"/>
    </marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" class="gatefill"/>
    </marker>
  </defs>

  <!-- 主线：上下文 → Agent → 工具 → 验证 → 交付 -->
  <rect x="20" y="140" width="100" height="60" rx="10" class="node"/>
  <text x="70" y="166" text-anchor="middle" font-size="14" font-weight="bold" class="t">上下文</text>
  <text x="70" y="186" text-anchor="middle" font-size="11" class="s">视野</text>

  <line x1="120" y1="170" x2="166" y2="170" class="brandline" marker-end="url(#ah)"/>

  <rect x="170" y="140" width="100" height="60" rx="10" class="node"/>
  <text x="220" y="166" text-anchor="middle" font-size="14" font-weight="bold" class="t">Agent</text>
  <text x="220" y="186" text-anchor="middle" font-size="11" class="s">执行者</text>

  <line x1="270" y1="170" x2="316" y2="170" class="brandline" marker-end="url(#ah)"/>

  <rect x="320" y="140" width="100" height="60" rx="10" class="node"/>
  <text x="370" y="166" text-anchor="middle" font-size="14" font-weight="bold" class="t">工具</text>
  <text x="370" y="186" text-anchor="middle" font-size="11" class="s">手脚</text>

  <line x1="420" y1="170" x2="466" y2="170" class="brandline" marker-end="url(#ah)"/>

  <rect x="470" y="140" width="100" height="60" rx="10" class="node"/>
  <text x="520" y="166" text-anchor="middle" font-size="14" font-weight="bold" class="t">验证</text>
  <text x="520" y="186" text-anchor="middle" font-size="11" class="s">质检</text>

  <line x1="570" y1="170" x2="616" y2="170" class="brandline" marker-end="url(#ah)"/>

  <rect x="620" y="140" width="100" height="60" rx="10" class="card"/>
  <text x="670" y="166" text-anchor="middle" font-size="14" font-weight="bold" class="t">交付</text>
  <text x="670" y="186" text-anchor="middle" font-size="11" class="s">成品 + 记录</text>

  <!-- 权限：门禁，落在 Agent 与工具之间 -->
  <rect x="245" y="44" width="100" height="44" rx="10" class="gate"/>
  <text x="295" y="63" text-anchor="middle" font-size="14" font-weight="bold" class="t">权限</text>
  <text x="295" y="80" text-anchor="middle" font-size="11" class="s">门禁</text>
  <line x1="295" y1="88" x2="295" y2="162" class="gateline" marker-end="url(#ahg)"/>

  <!-- 状态：与 Agent 双向 -->
  <rect x="170" y="246" width="100" height="44" rx="10" class="card"/>
  <text x="220" y="265" text-anchor="middle" font-size="14" font-weight="bold" class="t">状态</text>
  <text x="220" y="281" text-anchor="middle" font-size="11" class="s">进度</text>
  <line x1="220" y1="204" x2="220" y2="240" class="brandline" marker-end="url(#ah)" marker-start="url(#ahr)"/>

  <!-- 反馈：验证 → 上下文 -->
  <path d="M 520 204 C 520 336 70 336 70 206" class="brandline" marker-end="url(#ah)"/>
  <text x="300" y="322" text-anchor="middle" font-size="11" class="s">反馈 · 复盘后更新上下文与规则</text>
</svg>
