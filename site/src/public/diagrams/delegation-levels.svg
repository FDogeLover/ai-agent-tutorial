<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" role="img" aria-label="委派层级 1 到 4 阶梯图：全自动、分段确认、人工执行关键步、不委派，风险与人的参与递增">
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
    .t{fill:#1e293b}.s{fill:#64748b}
    .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
    .node{fill:#f5f8ff;stroke:#2563eb;stroke-width:1.5}
    .danger{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5}
    .badge{fill:#2563eb}.badge-r{fill:#dc2626}
    .wt{fill:#ffffff}
    .brandline{stroke:#2563eb;stroke-width:1.6;fill:none}
    .brandtext{fill:#2563eb}.dangertext{fill:#dc2626}
    @media (prefers-color-scheme: dark){
      .t{fill:#e2e8f0}.s{fill:#94a3b8}
      .card{fill:#151d2b;stroke:#334155}
      .node{fill:#17233b;stroke:#3b82f6}
      .danger{fill:#2a1518;stroke:#f87171}
      .badge{fill:#3b82f6}.badge-r{fill:#f87171}
      .brandline{stroke:#3b82f6}
      .brandtext{fill:#60a5fa}.dangertext{fill:#f87171}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" class="badge"/>
    </marker>
  </defs>

  <!-- 层级 1 -->
  <rect x="30" y="210" width="150" height="60" rx="10" class="node"/>
  <circle cx="52" cy="231" r="11" class="badge"/>
  <text x="52" y="235" text-anchor="middle" font-size="12" font-weight="bold" class="wt">1</text>
  <text x="70" y="236" font-size="14" font-weight="bold" class="t">全自动</text>
  <text x="44" y="258" font-size="11" class="s">规则清、材料齐、风险低</text>

  <!-- 层级 2 -->
  <rect x="195" y="165" width="150" height="105" rx="10" class="node"/>
  <circle cx="217" cy="186" r="11" class="badge"/>
  <text x="217" y="190" text-anchor="middle" font-size="12" font-weight="bold" class="wt">2</text>
  <text x="235" y="191" font-size="14" font-weight="bold" class="t">分段确认</text>
  <text x="209" y="213" font-size="11" class="s">每完成一段，停下让你看</text>

  <!-- 层级 3 -->
  <rect x="360" y="120" width="150" height="150" rx="10" class="node"/>
  <circle cx="382" cy="141" r="11" class="badge"/>
  <text x="382" y="145" text-anchor="middle" font-size="12" font-weight="bold" class="wt">3</text>
  <text x="400" y="146" font-size="14" font-weight="bold" class="t">人工关键步</text>
  <text x="374" y="168" font-size="11" class="s">决策与敏感操作由人做</text>

  <!-- 层级 4 -->
  <rect x="525" y="75" width="150" height="195" rx="10" class="danger"/>
  <circle cx="547" cy="96" r="11" class="badge-r"/>
  <text x="547" y="100" text-anchor="middle" font-size="12" font-weight="bold" class="wt">4</text>
  <text x="565" y="101" font-size="14" font-weight="bold" class="dangertext">不委派</text>
  <text x="539" y="123" font-size="11" class="s">钱/隐私/法律/实时红线</text>

  <!-- 底部递增箭头 -->
  <line x1="30" y1="296" x2="686" y2="296" class="brandline" marker-end="url(#ah)"/>
  <text x="360" y="320" text-anchor="middle" font-size="12" class="s">风险与人的参与程度递增</text>
  <text x="360" y="348" text-anchor="middle" font-size="11" class="s">注：这套编号管「交不交、交多少」；第 8 章权限分级 L0–L3 管「给什么权限」，两套不同</text>
</svg>
