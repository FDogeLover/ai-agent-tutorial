<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">共同基准任务流程</title>
  <desc id="desc">项目说明、零散笔记、反馈、表格和图片交给桌面 Agent，生成项目总结、信息缺口、教程目录、写作计划、待办和自检六份文件。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#687381"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#fbfbfc"/>
  <text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#18202a">共同基准任务：相同输入、相同边界、相同验收</text>
  <rect x="55" y="120" width="250" height="300" rx="18" fill="#e9f0ff" stroke="#7598df"/>
  <text x="180" y="160" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#274b8c">输入材料</text>
  <g font-family="sans-serif" font-size="18" fill="#24303c">
    <text x="90" y="210">项目说明</text>
    <text x="90" y="250">零散笔记</text>
    <text x="90" y="290">新手反馈</text>
    <text x="90" y="330">产品表格</text>
    <text x="90" y="370">两张图片</text>
  </g>
  <rect x="380" y="195" width="200" height="150" rx="75" fill="#1f2935"/>
  <text x="480" y="260" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#ffffff">桌面 Agent</text>
  <text x="480" y="297" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#d6dbe2">只读输入 · 写入输出</text>
  <rect x="655" y="100" width="250" height="340" rx="18" fill="#e9f8ef" stroke="#62ad81"/>
  <text x="780" y="140" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#286d47">六份交付物</text>
  <g font-family="sans-serif" font-size="18" fill="#24303c">
    <text x="690" y="190">项目总结</text>
    <text x="690" y="230">信息缺口</text>
    <text x="690" y="270">教程目录</text>
    <text x="690" y="310">写作计划</text>
    <text x="690" y="350">待办清单</text>
    <text x="690" y="390">自检记录</text>
  </g>
  <line x1="305" y1="270" x2="375" y2="270" stroke="#687381" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="580" y1="270" x2="650" y2="270" stroke="#687381" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="480" y="490" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#59636f">不联网 · 不覆盖原文件 · 不扩大权限 · 不编造缺失事实</text>
</svg>
