<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">七款桌面 Agent 的四类入门分组</title>
  <desc id="desc">Claude 和 Codex 属于海外综合型，TraeWork 和 WorkBuddy 属于国内综合型，Qoder 和 ZCode 属于代码优先型，Hermes Desktop 属于开源自主型。</desc>
  <rect width="960" height="540" fill="#f7f8fa"/>
  <text x="480" y="58" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#18202a">七款桌面 Agent：四类入门认识</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="110" width="390" height="150" rx="18" fill="#e8efff" stroke="#7296e5"/>
    <text x="255" y="150" font-size="22" fill="#254a91">海外闭源托管型综合 Agent</text>
    <text x="255" y="205" font-size="25" fill="#18202a">Claude · Codex</text>
    <rect x="510" y="110" width="390" height="150" rx="18" fill="#e7f7ef" stroke="#5cac82"/>
    <text x="705" y="150" font-size="22" fill="#24704a">国内综合型 Agent</text>
    <text x="705" y="205" font-size="25" fill="#18202a">TraeWork · WorkBuddy</text>
    <rect x="60" y="310" width="390" height="150" rx="18" fill="#fff1df" stroke="#d89845"/>
    <text x="255" y="350" font-size="22" fill="#8a561e">代码优先型 Agent</text>
    <text x="255" y="405" font-size="25" fill="#18202a">Qoder · ZCode</text>
    <rect x="510" y="310" width="390" height="150" rx="18" fill="#f3eaff" stroke="#9a70cf"/>
    <text x="705" y="350" font-size="22" fill="#684194">开源自主型 Agent</text>
    <text x="705" y="405" font-size="25" fill="#18202a">Hermes Desktop</text>
  </g>
  <text x="480" y="505" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#59636f">分组用于建立第一印象，不代表能力排名</text>
</svg>
